name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Spec Kit CLI
        run: |
          pipx install specify-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Spec Kit CLI
        run: specify --version

      - name: Install dependencies
        run: npm ci

      - name: Verify bash script syntax
        run: |
          for script in scripts/*.sh scripts/**/*.sh; do
            [ -e "$script" ] || continue
            bash -n "$script"
            echo "ok: $script"
          done

      - name: Verify bundle manifest
        run: |
          node -e "
            const fs = require('fs');
            const yaml = require('yaml');
            const manifest = yaml.parse(fs.readFileSync('bundle.yml', 'utf8'));
            if (!manifest.requires || !manifest.requires.speckit_version) {
              throw new Error('bundle.yml must declare requires.speckit_version');
            }
            console.log('bundle.yml OK:', manifest.bundle.id, manifest.bundle.version);
          "

      - name: Run test suite
        run: npm test

      - name: Build release artifact
        run: bash scripts/build-release.sh

      - name: Guard release artifact hygiene
        run: |
          zip_file="$(ls viteplus-stitch-*.zip | head -n 1)"
          test -n "$zip_file"
          entries="$(unzip -Z1 "$zip_file")"
          if printf '%s\n' "$entries" | grep -qE '^(node_modules|tests)/'; then
            echo "::error::Release artifact must not ship development files"
            exit 1
          fi
          size_kb=$(( $(wc -c < "$zip_file") / 1024 ))
          if [ "$size_kb" -ge 1024 ]; then
            echo "::error::Release artifact is ${size_kb}KB, budget is 1024KB"
            exit 1
          fi
          printf 'Release artifact OK: %s (%sKB)\n' "$zip_file" "$size_kb"

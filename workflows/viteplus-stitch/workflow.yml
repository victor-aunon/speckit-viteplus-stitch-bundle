schema_version: "1.0"
workflow:
  id: "viteplus-stitch"
  name: "Vite+ Stitch SDD Lifecycle"
  version: "1.1.0"
  author: "victor-aunon"
  description: "Deterministic SDD workflow featuring Vite+, Google Stitch MCP, Impeccable UI craft lifecycle, phase-by-phase implementation checkpoints, and architectural, env-config & visual quality gates"

requires:
  speckit_version: ">=0.8.5"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature you want to build"
  has_ui:
    type: boolean
    default: true
    prompt: "Does this feature include UI components or frontend views?"
  enable_stitch:
    type: boolean
    default: true
    prompt: "Do you want to use Google Stitch for UI design and tokens? (Applies when has_ui is true)"
  integration:
    type: string
    default: "auto"
    prompt: "Agent integration to use (e.g. gemini, claude, copilot; 'auto' uses the project's integration)"
  auto_continue:
    type: boolean
    default: false
    prompt: "Automatically continue through all implementation phases without pausing after each phase? (default: pause and ask after each phase)"

steps:
  - id: guardrails
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      You are running the viteplus-stitch Spec-Driven Development workflow.
      Before any work starts, read `.specify/workflows/viteplus-stitch/GUARDRAILS.md`
      and `.specify/memory/constitution.md` (sections "Quality Gate Integrity" and
      "Impeccable UI Craft Lifecycle").

      NON-NEGOTIABLE RULE: at no point may you modify Vite settings
      (`vite.config.ts` or any Vite/Vite+ config), the quality scripts
      (`.specify/scripts/bash/check-quality-gate.sh`, `check-env-config.sh`,
      `verify-stitch-design.sh`), `package.json` quality scripts,
      `.specify/extensions.yml`, test files/snapshots, or any lint/type/complexity
      rule to make a failing gate or test pass. Fix the application code instead.
      If you believe a gate is genuinely wrong, stop and ask the human for explicit
      approval before changing it.

      Acknowledge this rule and stop. Do not modify any files in this step.

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the technical specification in specs/<feature>/spec.md before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} --with-viteplus {% if inputs.has_ui and inputs.enable_stitch %}--with-stitch{% endif %}"

  - id: critique-design
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: impeccable-critique
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          This feature includes UI components.
          Before the human design review gate, perform an Impeccable Design Critique:

          1. Activate the `impeccable` skill and review the UI architecture:
             - If Stitch was enabled: inspect screens in `specs/<feature>/designs/` and `tokens.css`.
             - If Stitch was NOT enabled: inspect UI wireframes, component contracts, and design tokens specified in `plan.md`.
          2. Evaluate visual hierarchy, cognitive load (Operate vs Persuade), contrast ratios (WCAG AA), typographic rhythm, and Tailwind/shadcn tokens.
          3. Generate `specs/<feature>/designs/DESIGN_CRITIQUE.md` with:
             - Executive Assessment
             - Heuristic Findings
             - Actionable Adjustments (or Stitch edit_screens prompts)
          4. Output a concise 5-line summary for the human reviewer in the terminal.

  - id: review-design
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: review-design-gate
        type: gate
        message: "Review UI design proposal and Impeccable critique in specs/<feature>/designs/DESIGN_CRITIQUE.md."
        options: [approve, request_changes]
        on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} --phased {% if inputs.has_ui %}--with-impeccable-lifecycle{% endif %}"

  - id: implement
    type: if
    condition: "{{ inputs.auto_continue }}"
    then:
      - id: implement-auto
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }} --phased --verify-gates --auto-continue"
    else:
      - id: implement-paused
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }} --phased --verify-gates --pause-after-phase"

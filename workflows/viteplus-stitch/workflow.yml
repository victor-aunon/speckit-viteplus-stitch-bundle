schema_version: "1.0"
workflow:
  id: "viteplus-stitch"
  name: "Vite+ Stitch SDD Lifecycle"
  version: "1.2.0"
  author: "victor-aunon"
  description: "Deterministic SDD workflow featuring Vite+, Google Stitch MCP, Impeccable UI craft lifecycle, phase-by-phase implementation checkpoints, and architectural, env-config & visual quality gates"

requires:
  speckit_version: ">=0.8.5"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature you want to build"
  scope:
    type: string
    default: ""
    prompt: "Target feature directory slice (e.g. src/features/billing; leave empty for auto-detection)"
  has_ui:
    type: boolean
    default: true
    prompt: "Does this feature include UI components or frontend views?"
  enable_stitch:
    type: boolean
    default: true
    prompt: "Do you want to use Google Stitch for UI design and tokens? (Applies when has_ui is true)"
  stitch_project_id:
    type: string
    default: ""
    prompt: "Existing Google Stitch Project ID (e.g. 4044680601076201931). When provided, imports existing screens instead of generating new ones."
  integration:
    type: string
    default: "auto"
    prompt: "Agent integration to use (e.g. gemini, claude, copilot, pi; 'auto' uses the project's integration)"
  implement_integration:
    type: string
    default: ""
    prompt: "Agent integration for task implementation (defaults to 'integration' when empty, e.g. 'pi', 'claude', 'gemini')"
  auto_continue:
    type: boolean
    default: false
    prompt: "Automatically continue through all implementation phases without pausing after each phase? (default: pause and ask after each phase)"
  model:
    type: string
    default: ""
    prompt: "Primary AI model for architecture, specification, design critique, and verification (leave empty for integration default)"
  implement_model:
    type: string
    default: ""
    prompt: "AI model for task implementation (defaults to 'model' when empty)"

steps:
  - id: guardrails
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    prompt: |
      ROLE: ARCHITECTURAL GOVERNANCE & PROTOCOL ENFORCER.
      You are running the viteplus-stitch Spec-Driven Development workflow.
      Before any work starts, read `.specify/workflows/viteplus-stitch/GUARDRAILS.md`
      and `.specify/memory/constitution.md` (sections "Quality Gate Integrity" and
      "Impeccable UI Craft Lifecycle").
      {% if inputs.scope %}
      FEATURE SCOPE RESTRICTION: All work is restricted to slice '{{ inputs.scope }}'.
      Do NOT modify or create application source files outside this directory.
      {% endif %}
      NON-NEGOTIABLE RULE: at no point may you modify Vite settings
      (`vite.config.ts` or any Vite/Vite+ config), weaken `package.json` quality scripts,
      alter the quality scripts (`.specify/scripts/bash/check-quality-gate.sh`,
      `check-env-config.sh`, `verify-stitch-design.sh`), `.specify/extensions.yml`,
      test files/snapshots, or any lint/type/complexity rule to make a failing gate
      or test pass. (Creating `package.json`, managing dependencies with npm, and
      writing product code is expected and required). Fix the application code instead.
      If you believe a gate is genuinely wrong, stop and ask the human for explicit
      approval before changing it.

      REAL EXECUTION & DEPENDENCY MANDATE:
      - You MUST install real dependencies (`vp install` or `npm install`) via terminal whenever `package.json` is created or modified.
      - NEVER use `read_file`, `list_directory`, or file-reading tools on `node_modules/` (symlinks trigger sandbox boundary errors). Diagnose packages via terminal: `npm ls`, `npm install`, or `vp check`.
      - After completing each task in `tasks.md`, you MUST run `bash .specify/scripts/bash/check-quality-gate.sh` via the terminal and verify it passes (exit code 0).
      - Marking a task `- [x]` without executing the quality gate in the terminal is strictly forbidden.
      - Spec Kit runs automated quality gates (`gate_quality`, `gate_bundle`, `gate_contracts`) as non-agent shell steps with an automated self-healing repair window.

      Acknowledge this rule and stop. Do not modify any files in this step.

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    input:
      args: "{{ inputs.spec }}"

  - id: audit-spec
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    timeout: 600
    prompt: |
      ROLE: LEAD REQUIREMENTS & DOMAIN ARCHITECT.
      Perform an automated Spec Quality & Completeness Audit on the generated specification:

      1. Inspect `specs/<feature>/spec.md` (or the active feature spec).
      2. Verify the specification against deterministic SDD quality criteria:
         - User Stories & Value: Every story defines clear actor, action, and expected business outcome.
         - Acceptance Criteria: Every story includes unambiguous Given/When/Then scenarios.
         - Robustness & Edge Cases: Explicitly defines error handling, network/storage failures, empty states, and validation boundaries.
         - Architectural Boundaries: Enforces Clean Architecture / vertical slice boundaries without leaking infrastructure details.
      3. Generate `specs/<feature>/SPEC_AUDIT.md` with:
         - Executive Quality Score (0-100%) and Pass/Fail status (threshold: 90%)
         - Scenario Matrix: list of covered user journeys and edge cases
         - Remediation: if any criteria are ambiguous or missing, update `spec.md` directly to satisfy them.
      4. Output a concise 5-line executive summary in the terminal.

  - id: review-spec
    type: if
    condition: "{{ not inputs.auto_continue }}"
    then:
      - id: review-spec-gate
        type: gate
        message: "Review the technical specification in specs/<feature>/spec.md and audit in specs/<feature>/SPEC_AUDIT.md before planning."
        options: [approve, reject]
        on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    input:
      args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --with-viteplus {% if inputs.has_ui and inputs.enable_stitch %}--with-stitch{% endif %}"

  - id: generate-designs
    type: if
    condition: "{{ inputs.has_ui and inputs.enable_stitch }}"
    then:
      - id: stitch-design-generation
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.model }}"
        timeout: 900
        prompt: |
          ROLE: UI SYSTEMS DESIGN ENGINEER (GOOGLE STITCH MCP).
          Generate high-fidelity UI screens and canonical design tokens using Google Stitch MCP:

          EXECUTION PROTOCOL:
          - Execute all Stitch MCP tools directly in this conversation. Do NOT delegate Stitch tool calls or verification to subagents (subagents lack access to MCP extensions).
          - TEXT-ONLY ASSETS RULE: Never attempt to download binary screenshots, create fake .png files, or call `read_file` on any `.png` file. In Gemini CLI, reading ASCII text with a `.png` extension triggers fatal Google API 400 codec errors. The complete visual design master is the HTML code (`<screen-id>.html`).

          STEPS:
          0. Idempotency Check: Inspect `specs/<feature>/designs/`. If `.html` screens, `tokens.css`, and `routes-manifest.json` already exist, verify their completeness, ensure fixtures exist, and output the summary table immediately without re-generating from scratch.
          1. Inspect `specs/<feature>/spec.md` and `plan.md` to identify the core user journeys and all required screens/views.
          2. Locate or create the feature designs directory at `specs/<feature>/designs/` and subdirectory `specs/<feature>/designs/fixtures/`.
          3. SOURCING STITCH DESIGNS:
             {% if inputs.stitch_project_id %}
             - EXISTING STITCH STUDIO PROJECT (inputs.stitch_project_id: "{{ inputs.stitch_project_id }}"):
               * Do NOT generate new screens from text. Import existing screens from project ID "{{ inputs.stitch_project_id }}".
               * Call `list_screens(projectId: "{{ inputs.stitch_project_id | replace('projects/', '') }}")` to enumerate all project screens.
               * Call `get_screen` for each screen to retrieve its `html_code` reference.
               * Download each HTML file using `download_file` with `name: <screen.html_code.name>` and save to `specs/<feature>/designs/<screen-id>.html`.
               * Inspect downloaded HTML files to extract and populate `tokens.css` with active CSS variables.
             {% else %}
             - NEW DESIGN GENERATION VIA STITCH MCP:
               * Call `create_project` (or target active project) with the feature title.
               * Call `create_design_system` to establish color palette, typography (Inter/Roboto), corner roundness, and appearance theme aligned with the project.
               * For each primary screen described in the specification, call `generate_screen_from_text` with rich layout, accessibility, and component details.
               * Call `get_screen` for each generated screen to retrieve its `html_code` reference.
               * Download ONLY the HTML code using `download_file` with `name: <screen.html_code.name>`:
                 Save the HTML code to `specs/<feature>/designs/<screen-id>.html` using `write_file`.
                 Do NOT call `download_file` on `screenshot.name`. The HTML file contains the full markup, CSS tokens, and layout.
             {% endif %}
          4. Extract and create the canonical design tokens stylesheet at `specs/<feature>/designs/tokens.css`:
             - Define CSS variables under `:root` for colors (`--color-background`, `--color-surface`, `--color-primary`, `--color-text`, etc.), radii (`--radius-sm`, `--radius-md`, `--radius-lg`), typography (`--font-family`, `--font-size-*`), and spacing (`--space-*`).
          5. Create `specs/<feature>/designs/routes-manifest.json` following `.specify/templates/routes-manifest.json.tmpl`:
             - Map each screen to its local development route (e.g. `/`, `/analytics`), title, DOM test selector, and fixture mock data path.
             - Generate declared fixture JSON mock files in `specs/<feature>/designs/fixtures/`.
          6. Fallback Resilience: If Google Stitch MCP is unavailable or encounters connection/rate-limit errors, generate clean wireframe HTML files directly (`<screen-id>.html`), `tokens.css`, and `routes-manifest.json`. Do NOT create dummy `.png` files.
          7. Output a summary table in the terminal listing all generated screens, HTML files, and token variables.

  - id: critique-design
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: impeccable-critique
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.model }}"
        timeout: 600
        prompt: |
          ROLE: HEURISTIC UX & ACCESSIBILITY (A11Y) AUDITOR.
          This feature includes UI components.
          Before the human design review gate, perform an Impeccable Design Critique:

          1. Activate the `impeccable` skill using the `activate_skill(name: 'impeccable')` tool (do NOT use `read_file` on external paths outside the workspace) and review the UI architecture:
             - If Stitch was enabled: inspect screens in `specs/<feature>/designs/*.html` and `tokens.css`.
             - If Stitch was NOT enabled: inspect UI wireframes, component contracts, and design tokens specified in `plan.md`.
          2. Evaluate visual hierarchy, cognitive load (Operate vs Persuade), contrast ratios (WCAG AA), typographic rhythm, and Tailwind/shadcn tokens.
          3. Generate `specs/<feature>/designs/DESIGN_CRITIQUE.md` with:
             - Executive Assessment
             - Heuristic Findings
             - Actionable Adjustments (or Stitch edit_screens prompts)
          4. Output a concise 5-line summary for the human reviewer in the terminal.

  - id: review-design
    type: if
    condition: "{{ inputs.has_ui and not inputs.auto_continue }}"
    then:
      - id: review-design-gate
        type: gate
        message: "Review UI design proposal and Impeccable critique in specs/<feature>/designs/DESIGN_CRITIQUE.md."
        options: [approve, reject]
        on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    input:
      args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --phased {% if inputs.has_ui %}--with-impeccable-lifecycle{% endif %}"

  - id: implement
    type: if
    condition: "{{ inputs.auto_continue }}"
    then:
      - id: implement-auto
        command: speckit.implement
        integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
        model: "{{ inputs.implement_model | default(inputs.model) }}"
        input:
          args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --phased --verify-gates --auto-continue"
    else:
      - id: implement-paused
        command: speckit.implement
        integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
        model: "{{ inputs.implement_model | default(inputs.model) }}"
        input:
          args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --phased --verify-gates --pause-after-phase"

  - id: bootstrap_deps
    type: shell
    continue_on_error: true
    run: |
      if [ -f package.json ] && [ ! -d node_modules ]; then
        echo "Installing dependencies..." >/dev/tty 2>/dev/null || true
        npm install --no-audit --no-fund || vp install || pnpm install || true
      fi

  - id: bootstrap_env
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/bootstrap-project-env.sh || true

  - id: gate_quality
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-quality-gate.sh {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [QUALITY GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
        bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
        exit $err
      }

  - id: gate_bundle
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-bundle-budget.sh || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [PERFORMANCE GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
        bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
        exit $err
      }

  - id: gate_contracts
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: gate_contracts_check
        type: shell
        continue_on_error: true
        run: |
          bash .specify/scripts/bash/check-contracts.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} || {
            err=$?
            echo "" >/dev/tty 2>/dev/null || true
            echo "⚠️  [CONTRACT GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
            bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
            exit $err
          }
      - id: gate_visual_check
        type: shell
        continue_on_error: true
        run: |
          bash .specify/scripts/bash/verify-stitch-design.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} || {
            err=$?
            echo "" >/dev/tty 2>/dev/null || true
            echo "⚠️  [VISUAL GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
            bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
            exit $err
          }

  - id: gate_tasks
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-tasks-complete.sh || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [TASKS GATE] Unchecked tasks remain (Exit $err)." >/dev/tty 2>/dev/null || true
        exit $err
      }

  # ---------------------------------------------------------------------------
  # Bounded self-healing loop. Every deterministic gate is repaired, re-run and
  # re-evaluated. The recheck steps MUST NOT append `|| true`: a swallowed exit
  # code would make the loop condition always false (the previous loop's bug).
  # ---------------------------------------------------------------------------
  - id: repair_gates
    type: if
    condition: "{{ steps.gate_quality.output.exit_code != 0 or steps.gate_bundle.output.exit_code != 0 or (inputs.has_ui and steps.gate_contracts_check.output.exit_code != 0) or (inputs.has_ui and steps.gate_visual_check.output.exit_code != 0) or steps.gate_tasks.output.exit_code != 0 }}"
    then:
      - id: repair_gates_loop
        type: do-while
        max_iterations: 3
        condition: "{{ steps.recheck_quality.output.exit_code != 0 or steps.recheck_bundle.output.exit_code != 0 or (inputs.has_ui and steps.recheck_contracts_check.output.exit_code != 0) or (inputs.has_ui and steps.recheck_visual_check.output.exit_code != 0) or steps.recheck_tasks.output.exit_code != 0 }}"
        steps:
          - id: repair_agent
            type: prompt
            integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
            model: "{{ inputs.implement_model | default(inputs.model) }}"
            timeout: 1800
            prompt: |
              ROLE: RELIABILITY & COMPILER SRE SPECIALIST (AUTONOMOUS REPAIR).
              The implementation gates failed. You own this repair window: fix the
              APPLICATION CODE and the PRODUCT BEHAVIOR, never the checks.

              EVIDENCE FIRST:
              - Read `specs/<feature>/evidence/quality-gate.json`, `bundle-budget.json`,
                `contracts.json`, `tasks.json` and `.specify/telemetry.jsonl`.
              - Reproduce each failure by running the real gate in the terminal before
                changing anything.

              REPAIR RULES (NON-NEGOTIABLE):
              - NEVER pass `--allow-no-tests`, `--allow-incomplete`, `--allow-missing`,
                `--allow-foreign-git`, `--tokens-only`, `--skip-tests`, `--skip-build`
                or `--skip-orphans`. This loop exists to fix code, not to silence gates.
              - NEVER edit `.specify/scripts/**`, `vite.config.*`, `vitest.config.*`,
                `package.json` quality scripts, test snapshots, lint/complexity rules,
                or any evidence JSON by hand.
              - ZERO EXECUTED TESTS is the most common failure: write real co-located
                unit/integration tests for the feature slice, then re-run the gate.
                A scaffold placeholder is not an implementation.
              - GHOST SELECTOR: add the declared `data-testid` / `id` / class to the
                component. The manifest is human-owned; if the design genuinely
                differs, stop and ask instead of rewriting it.
              - MISSING PLAYWRIGHT ASSETS: `bootstrap-project-env.sh` already
                materialized `playwright.design.config.ts` and
                `tests/design/design-audit.spec.ts` when designs exist. Verify them
                instead of deleting the visual gate.
              - UNCHECKED TASKS: implement them. Never tick a checkbox without running
                `check-quality-gate.sh` and seeing exit code 0.
              - DEPENDENCIES: install with `npm install` / `vp install` in the terminal.
                NEVER use file-reading tools on `node_modules/` (sandbox symlink errors).

              Re-run the failing gates yourself and print a 5-line summary:
              root cause -> fix -> gate result per failing gate.
          - id: recheck_quality
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-quality-gate.sh {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %}
          - id: recheck_bundle
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-bundle-budget.sh
          - id: recheck_contracts
            type: if
            condition: "{{ inputs.has_ui }}"
            then:
              - id: recheck_contracts_check
                type: shell
                continue_on_error: true
                run: |
                  bash .specify/scripts/bash/check-contracts.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %}
              - id: recheck_visual_check
                type: shell
                continue_on_error: true
                run: |
                  bash .specify/scripts/bash/verify-stitch-design.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %}
          - id: recheck_tasks
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-tasks-complete.sh
      - id: fail_after_repair
        type: if
        condition: "{{ steps.recheck_quality.output.exit_code != 0 or steps.recheck_bundle.output.exit_code != 0 or (inputs.has_ui and steps.recheck_contracts_check.output.exit_code != 0) or (inputs.has_ui and steps.recheck_visual_check.output.exit_code != 0) or steps.recheck_tasks.output.exit_code != 0 }}"
        then:
          - id: abort_unrepaired
            type: shell
            run: |
              echo "" >/dev/tty 2>/dev/null || true
              echo "❌ [REPAIR LOOP EXHAUSTED]: gates are still failing after 3 repair attempts." >/dev/tty 2>/dev/null || true
              echo "   The workflow stops instead of shipping a broken feature. Inspect the evidence below." >/dev/tty 2>/dev/null || true
              bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
              echo "" >/dev/tty 2>/dev/null || true
              echo "   Next step: fix the root cause, reset the breaker (bash .specify/scripts/bash/check-blast-radius.sh --reset)," >/dev/tty 2>/dev/null || true
              echo "   then resume the run with 'specify workflow resume'." >/dev/tty 2>/dev/null || true
              exit 1

  - id: verify
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    timeout: 900
    prompt: |
      ROLE: LEAD ADVERSARIAL QUALITY AUDITOR (INDEPENDENT QC INSPECTOR).
      You did NOT write this implementation, and you MUST NOT trust any prior
      self-reported claim in `tasks.md` or the agent's summary.

      MANDATORY PROTOCOL: read `.specify/workflows/viteplus-stitch/AUDITOR.md`
      and execute it exactly. It defines the evidence rules, the re-execution
      commands, the acceptance-scenario matrix, the accessibility audit, and the
      machine-verdict contract.

      Two deliverables are required, both under `specs/<feature>/`:
      1. `evidence/verification.json` with `{"verdict": "pass" | "reject", ...}`.
      2. `VERIFICATION_REPORT.md` whose `VERDICT:` line matches that JSON.

      The workflow fails unless the machine verdict is `"pass"`. If the feature is
      a scaffold, reject it and list the blocking reasons. Never soften a reject.

  - id: gate_verdict
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-verification-verdict.sh || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [VERDICT GATE] Independent audit did not approve the feature (Exit $err). Entering repair loop." >/dev/tty 2>/dev/null || true
        exit $err
      }

  - id: repair_verdict
    type: if
    condition: "{{ steps.gate_verdict.output.exit_code != 0 }}"
    then:
      - id: repair_verdict_loop
        type: do-while
        max_iterations: 2
        condition: "{{ steps.gate_verdict_retry.output.exit_code != 0 }}"
        steps:
          - id: verdict_repair_agent
            type: prompt
            integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
            model: "{{ inputs.implement_model | default(inputs.model) }}"
            timeout: 1800
            prompt: |
              ROLE: RELIABILITY ENGINEER (POST-AUDIT REPAIR).
              The independent auditor REJECTED this feature.

              1. Read `specs/<feature>/evidence/verification.json` — the `reasons`
                 array lists the blocking findings — and `VERIFICATION_REPORT.md`.
              2. Fix the APPLICATION CODE so every blocking reason is closed.
              3. Re-run the deterministic gates yourself to confirm.

              You may NOT edit the audit report, the verdict JSON, other evidence
              artifacts, or any gate. You may NOT pass `--allow-*` flags. Passing
              those would silence the gate instead of fixing the product, and the
              independent auditor re-audits from scratch after you finish.
          - id: verify_retry
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ inputs.model }}"
            timeout: 900
            prompt: |
              ROLE: LEAD ADVERSARIAL QUALITY AUDITOR (RE-AUDIT AFTER REPAIR).
              The previous audit REJECTED this feature. Read the previous
              `verification.json` `reasons` and `VERIFICATION_REPORT.md`, then audit
              the CURRENT state FROM SCRATCH. Do not assume the repair worked.

              Follow `.specify/workflows/viteplus-stitch/AUDITOR.md` exactly, re-run
              the gates yourself, and OVERWRITE `evidence/verification.json` and
              `VERIFICATION_REPORT.md` with the fresh verdict. A prose report without
              the machine verdict is invalid.
          - id: gate_verdict_retry
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-verification-verdict.sh

  - id: telemetry_sync
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/emit-telemetry.sh --import-state || true
      bash .specify/scripts/bash/emit-telemetry.sh --summary >/dev/tty 2>/dev/null || true

  # Final hard gate: the workflow must not report success without an approving
  # machine verdict. This step has no continue_on_error on purpose.
  - id: gate_verdict_final
    type: shell
    run: |
      bash .specify/scripts/bash/check-verification-verdict.sh

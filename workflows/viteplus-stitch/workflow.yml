schema_version: "1.0"
workflow:
  id: "viteplus-stitch"
  name: "Vite+ Stitch SDD Lifecycle"
  version: "2.1.1"
  author: "victor-aunon"
  description: "Deterministic SDD workflow featuring Vite+, Google Stitch MCP, Impeccable UI craft lifecycle, phase-by-phase implementation checkpoints, and architectural, env-config & visual quality gates"

requires:
  speckit_version: ">=0.8.5"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature you want to build"
  scope:
    type: string
    default: ""
    prompt: "Target feature directory slice (e.g. src/features/billing; leave empty for auto-detection)"
  skip_specify:
    type: boolean
    default: false
    prompt: "Skip the specification step (speckit.specify) and audit an existing spec in specs/? (default: false)"
  has_ui:
    type: boolean
    default: true
    prompt: "Does this feature include UI components or frontend views?"
  enable_stitch:
    type: boolean
    default: true
    prompt: "Do you want to use Google Stitch for UI design and tokens? (Applies when has_ui is true)"
  stitch_project_id:
    type: string
    default: ""
    prompt: "Existing Google Stitch Project ID (e.g. 4044680601076201931). When provided, imports existing screens instead of generating new ones."
  integration:
    type: string
    default: "auto"
    prompt: "Agent integration to use (e.g. gemini, claude, copilot, pi; 'auto' uses the project's integration)"
  implement_integration:
    type: string
    default: ""
    prompt: "Agent integration for task implementation (defaults to 'integration' when empty, e.g. 'pi', 'claude', 'gemini')"
  auto_continue:
    type: boolean
    default: false
    prompt: "Automatically continue through all implementation phases without pausing after each phase? (default: pause and ask after each phase)"
  model:
    type: string
    default: ""
    prompt: "Primary AI model for architecture, specification, design critique, and verification (leave empty for integration default)"
  implement_model:
    type: string
    default: ""
    prompt: "AI model for task implementation (defaults to 'model' when empty)"

steps:
  - id: guardrails
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    prompt: |
      ROLE: ARCHITECTURAL GOVERNANCE & PROTOCOL ENFORCER.
      You are running the viteplus-stitch Spec-Driven Development workflow.
      Before any work starts, read `.specify/workflows/viteplus-stitch/GUARDRAILS.md`
      and `.specify/memory/constitution.md` (sections "Quality Gate Integrity" and
      "Impeccable UI Craft Lifecycle").
      {% if inputs.scope %}
      FEATURE SCOPE RESTRICTION: All work is restricted to slice '{{ inputs.scope }}'.
      Do NOT modify or create application source files outside this directory.
      {% endif %}
      NON-NEGOTIABLE RULE: at no point may you modify Vite settings
      (`vite.config.ts` or any Vite/Vite+ config), weaken `package.json` quality scripts,
      alter the quality scripts (`.specify/scripts/bash/check-quality-gate.sh`,
      `check-env-config.sh`, `verify-stitch-design.sh`), `.specify/extensions.yml`,
      test files/snapshots, or any lint/type/complexity rule to make a failing gate
      or test pass. (Creating `package.json`, managing dependencies with npm, and
      writing product code is expected and required). Fix the application code instead.
      If you believe a gate is genuinely wrong, stop and ask the human for explicit
      approval before changing it.

      REAL EXECUTION & DEPENDENCY MANDATE:
      - You MUST install real dependencies (`vp install` or `npm install`) via terminal whenever `package.json` is created or modified.
      - NEVER use `read_file`, `list_directory`, or file-reading tools on `node_modules/` (symlinks trigger sandbox boundary errors) or `.git/` (violates workspace security sandbox). Diagnose packages via terminal: `npm ls`, `npm install`, or `vp check`. Inspect git state exclusively via terminal: `git status`, `git diff`.
      - NEVER use `replace` or `write_file` on `package.json` (blocked by CLI security policy for build configuration files). To add or update scripts, use terminal commands: `npm pkg set scripts.<name>="..."`.
      - TWO KINDS OF TASK, TWO OWNERS. `tasks.md` mixes implementation work with
        verification work; do not treat them the same.
      - IMPLEMENTATION TASKS (untagged) are yours, and you mark them with a script,
        NEVER by editing `tasks.md`. After finishing one, run
        `bash .specify/scripts/bash/check-quality-gate.sh` (pass `--scope=<slice>`
        when the run declares a scope: that narrows the regression suite to your
        slice and makes a mid-feature pass reachable at all). Then run
        `bash .specify/scripts/bash/mark-task-done.sh --id=T001`.
      - MARK-TASK-DONE REFUSES unless the gate passed AND the pass postdates your
        last edit: a green gate from before your edit proves nothing about your
        edit. It records the tick in `evidence/task-ticks.jsonl`. Hand-editing a
        checkbox is a fatal violation of Quality Gate Integrity — it leaves no
        audit record, so a fabricated tick cannot be told apart from a verified one.
      - VERIFICATION TASKS (`[verify:<gate>]`) are NOT yours. Never tick and never
        un-tick them, by hand or in bulk. Their checkbox is derived by the workflow
        from the evidence the gate itself wrote: `reconcile-task-ledger.sh` ticks
        `[verify:quality|contracts|design|bundle|runtime]` when that gate reports
        `status: "passed"`, and un-ticks it when it regresses. Editing one by hand
        only makes the ledger disagree with the gates it mirrors.
      - TAG NEW VERIFICATION TASKS when you write or refine `tasks.md`. Any task
        whose completion IS a gate result must carry the tag, or it degrades into
        agent-asserted work. An unknown tag is a hard error, not a silent no-op.
      - EXPECT THE FULL GATE TO BE RED UNTIL THE END: it runs the whole suite and
        the build, so unimplemented tasks guarantee failure. That is your progress
        signal, not a reason to stop. If you reach `gate_tasks` with untagged work
        genuinely done but unmarked, tick what is demonstrably done and print
        `task id -> justification` for each.
      - Spec Kit runs automated quality gates (`gate_quality`, `gate_bundle`, `gate_contracts`) as non-agent shell steps with an automated self-healing repair window.
      {% if not inputs.has_ui %}
      RUNTIME ENTRYPOINT CONTRACT (has_ui=false):
      - `has_ui` describes THIS FEATURE, not the project. Most non-UI features live
        inside an existing React/Vite project, so you MUST NOT remove React, Vite,
        `@vitejs/plugin-react`, `vite.config.ts`, the typed env config, or the
        project's existing `dev` script.
      - Declare how the feature runs in `specs/<feature>/runtime.json` (start from
        `.specify/templates/runtime.json.tmpl`):
          {"kind":"http","command":"npm run dev:api","port":3000,"readiness":"/health"}
          {"kind":"http","command":"npm run dev","port":3000,"readiness":"/api/health"}
          {"kind":"none","reason":"<why this feature has no runtime entrypoint>"}
      - How to expose HTTP depends on the framework:
        * Bundler is Vite (this repository): add a NEW script (`"dev:api": "tsx watch
          src/main.ts"`) and never touch `dev`. `"command": "npm run dev:api"`.
        * Full-stack framework (Next.js, Nuxt, Astro, Remix, SvelteKit): the framework
          dev server already serves the endpoints (`app/api/<route>/route.ts`), so
          declare `"command": "npm run dev"` (or `"vp run dev"`) with a SPECIFIC
          readiness path such as `/api/health`. Do not invent a second server.
      - `gate_runtime` runs `check-dev-entrypoint.sh --require-contract`: it starts the
        declared command, probes the declared port and readiness path, and fails
        unless it gets an HTTP 2xx response. A manual `tsx src/main.ts` that the
        contract does not declare is a red gate, not a workaround.
      - Vite built-ins (`vp dev`, `vite`, `vp preview`) are REJECTED as the runtime: they
        always start the built-in Vite dev server and ignore package.json scripts. A
        dev-server runtime with `"readiness": "/"` is also rejected, because a frontend
        dev server answers 200 on / regardless of the API.
      - The port MUST come from the typed env config (`src/config/env.ts`) and be
        declared in `runtime.json` with the same value; the gate probes exactly that
        port, so drift between the two is a red gate. The spec, `quickstart.md`,
        the contract and the script must all agree on it.
      {% endif %}

      Acknowledge this rule and stop. Do not modify any files in this step.

  # Git ownership and Playwright assets must exist BEFORE the agent writes
  # anything: until the project root owns its repository, every diff-based gate
  # (anti-tampering, blast radius) audits an ancestor repository instead — the
  # classic $HOME trap. Deterministic and idempotent, so it runs first.
  - id: bootstrap_env_early
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/bootstrap-project-env.sh --has-ui={{ inputs.has_ui }} || true

  # Install-completeness check, before any agent time is spent. A script missing
  # from the install turns into a gate that can never pass, and the repair loop
  # then spends three 30-minute windows on a problem no edit can fix. Degrades to
  # a warning when the checker itself is absent (workflow newer than scripts).
  - id: preflight
    type: shell
    run: |
      if [ ! -f .specify/scripts/bash/check-bundle-preflight.sh ]; then
        echo "ℹ️  [PREFLIGHT] check-bundle-preflight.sh is not installed (older bundle); skipping."
        echo "   Reinstall the bundle to gain install-completeness checking."
        exit 0
      fi
      bash .specify/scripts/bash/check-bundle-preflight.sh

  - id: specify
    type: if
    condition: "{{ not inputs.skip_specify }}"
    then:
      - id: run-specify
        command: speckit.specify
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.model }}"
        input:
          args: "{{ inputs.spec }}"

  - id: audit-spec
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    timeout: 600
    prompt: |
      ROLE: LEAD REQUIREMENTS & DOMAIN ARCHITECT.
      Perform an automated Spec Quality & Completeness Audit on the specification (whether generated in this workflow or pre-existing from a prior specify/clarify session):

      1. Inspect `specs/<feature>/spec.md` (or the active feature spec). If `skip_specify` was set to true but no specification exists on disk, stop immediately and report that `specs/<feature>/spec.md` was not found.
      2. Verify the specification against deterministic SDD quality criteria:
         - User Stories & Value: Every story defines clear actor, action, and expected business outcome.
         - Acceptance Criteria: Every story includes unambiguous Given/When/Then scenarios.
         - Robustness & Edge Cases: Explicitly defines error handling, network/storage failures, empty states, and validation boundaries.
         - Architectural Boundaries: Enforces Clean Architecture / vertical slice boundaries without leaking infrastructure details.
      3. Generate `specs/<feature>/SPEC_AUDIT.md` with:
         - Executive Quality Score (0-100%) and Pass/Fail status (threshold: 90%)
         - Scenario Matrix: list of covered user journeys and edge cases
         - Remediation: if any criteria are ambiguous or missing, update `spec.md` directly to satisfy them.
      4. Output a concise 5-line executive summary in the terminal.

  - id: review-spec
    type: if
    condition: "{{ not inputs.auto_continue }}"
    then:
      - id: review-spec-gate
        type: gate
        message: "Review the technical specification in specs/<feature>/spec.md and audit in specs/<feature>/SPEC_AUDIT.md before planning."
        options: [approve, reject]
        on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    input:
      args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --with-viteplus {% if inputs.has_ui and inputs.enable_stitch %}--with-stitch{% endif %}"

  # Design artifacts are REQUIRED for any UI feature. Stitch is one way to
  # produce them, not the only one: with enable_stitch=false the step still runs
  # and generates local wireframes + tokens + manifest. Previously this step was
  # gated on `has_ui and enable_stitch`, so disabling Stitch skipped it entirely
  # and the --require-ui gates failed later with no artifacts on disk.
  - id: generate-designs
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: design-assets
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.model }}"
        timeout: 900
        prompt: |
          ROLE: UI SYSTEMS DESIGN ENGINEER{% if inputs.enable_stitch %} (GOOGLE STITCH MCP){% else %} (LOCAL WIREFRAME FALLBACK){% endif %}.
          Produce the canonical design artifacts every UI feature needs:
          screens, `tokens.css`, and `routes-manifest.json`. The contracts gate and
          the visual gate run with `--require-ui` and hard-fail without them.

          EXECUTION PROTOCOL:
          {% if inputs.enable_stitch %}
          - Execute all Stitch MCP tools directly in this conversation. Do NOT delegate Stitch tool calls or verification to subagents (subagents lack access to MCP extensions).
          - TEXT-ONLY ASSETS RULE: never download binary screenshots, create fake .png files, or read `.png` files with file tools. The design master is the HTML code (`<screen-id>.html`).
            The visual gate DERIVES its golden screenshots from that HTML on every run
            (`render-design-goldens.mjs`): the PNGs are build output under
            `tests/design/__snapshots__/`, never a deliverable and never committed. Do
            not create them yourself, and do not treat their absence as a missing artifact.
          {% else %}
          - Stitch is DISABLED for this run (`enable_stitch=false`). Do NOT call any Stitch MCP tool and do NOT ask the human to enable it.
          - You are responsible for producing the same artifacts locally, as self-contained HTML wireframes. This is not a degraded mode you may skip: the gates below are identical.
          {% endif %}

          STEPS:
          0. Idempotency Check: inspect `specs/<feature>/designs/`. If the HTML screens, `tokens.css`, and `routes-manifest.json` already exist, verify their completeness, ensure fixtures exist, and output the summary table immediately without regenerating.
          1. Inspect `specs/<feature>/spec.md` and `plan.md` to identify the core user journeys and all required screens/views.
          2. Locate or create `specs/<feature>/designs/` and `specs/<feature>/designs/fixtures/`.
          3. SOURCING SCREENS:
             {% if inputs.enable_stitch %}
             {% if inputs.stitch_project_id %}
             - EXISTING STITCH STUDIO PROJECT (inputs.stitch_project_id: "{{ inputs.stitch_project_id }}"):
               * Do NOT generate new screens from text. Import existing screens from project ID "{{ inputs.stitch_project_id }}".
               * Normalize the ID first: if it was provided as `projects/<id>`, use only `<id>` (the Stitch API rejects the prefixed form). Do the normalization yourself; the workflow expression engine has no string-filter functions.
               * Call `list_screens(projectId: "{{ inputs.stitch_project_id }}")` to enumerate all project screens.
               * Call `get_screen` for each screen to retrieve its `html_code` reference.
               * Download each HTML file using `download_file` with `name: <screen.html_code.name>` and save it to `specs/<feature>/designs/<screen-id>.html`.
               * Inspect the downloaded HTML and populate `tokens.css` with the active CSS variables.
             {% else %}
             - NEW DESIGN GENERATION VIA STITCH MCP:
               * Call `create_project` (or target the active project) with the feature title.
               * Call `create_design_system` to establish colour palette, typography (Inter/Roboto), corner roundness, and appearance theme aligned with the project.
               * For each primary screen in the specification, call `generate_screen_from_text` with rich layout, accessibility, and component details.
               * Call `get_screen` for each generated screen to retrieve its `html_code` reference.
               * Download ONLY the HTML code with `download_file` (`name: <screen.html_code.name>`) and save it to `specs/<feature>/designs/<screen-id>.html` using `write_file`. Never download `screenshot.name`.
             {% endif %}
             - If Stitch is unreachable or rate-limited, fall back to local wireframe HTML instead of stopping.
             {% else %}
             - LOCAL WIREFRAME PATH (`enable_stitch=false`):
               * Write one self-contained HTML file per screen: `specs/<feature>/designs/<screen-id>.html`, with inline `<style>` using the design tokens and real content from the spec (no lorem ipsum, no broken links).
               * Every screen must be usable at 360px and 1440px widths and include focus styles (`:focus-visible`), semantic landmarks, and `aria-label` on interactive controls.
               * Do NOT create `.png` files or screenshots.
             {% endif %}
          4. Create the canonical design tokens at `specs/<feature>/designs/tokens.css`:
             - Declare CSS variables under `:root`: colours (`--color-background`, `--color-surface`, `--color-primary`, `--color-text`, ...), radii (`--radius-sm|md|lg`), typography (`--font-family`, `--font-size-*`), and spacing (`--space-*`).
             - WIRE THEM INTO THE APP: the visual gate reads `getComputedStyle(document.documentElement)`, so every token must exist in the running DOM. Copy the `:root` block into `src/styles/app.css` (or `src/styles/tokens.css` imported by it). If the DOM does not expose a token, the gate fails even though the design file is perfect.
             - Keep `var(--other-token)` references; the audit resolves them exactly like the browser. Do NOT de-reference aliases to satisfy the check.
          5. Create `specs/<feature>/designs/routes-manifest.json` following `.specify/templates/routes-manifest.json.tmpl`:
             - Map each screen to a local route, title, DOM `selector`, viewport, and fixture path.
             - The `selector` MUST exist in the implementation later (the contracts gate cross-checks `src/`), so prefer a stable `[data-testid="..."]` contract and write it down in `plan.md`/`tasks.md`.
             - Generate the declared fixture JSON files under `specs/<feature>/designs/fixtures/`.
          6. Self-check before finishing: the three artifacts exist, `tokens.css` is non-empty, the manifest references existing fixtures, and the tokens are wired into the app stylesheet. A missing artifact is a gate failure later, not a warning.
          7. Output a summary table in the terminal listing screens, HTML files, token variables, and where the tokens were wired.

      # Deterministic gate: a prompt can finish without writing anything. Failing
      # here costs seconds; the alternative is discovering it after implementation.
      - id: design_artifacts
        type: shell
        run: |
          bash .specify/scripts/bash/check-design-artifacts.sh || {
            err=$?
            echo "" >/dev/tty 2>/dev/null || true
            echo "❌ [DESIGN GATE] Design artifacts are incomplete. Generate them, then resume the run." >/dev/tty 2>/dev/null || true
            exit $err
          }

  - id: critique-design
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: impeccable-critique
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.model }}"
        timeout: 600
        prompt: |
          ROLE: HEURISTIC UX & ACCESSIBILITY (A11Y) AUDITOR.
          This feature includes UI components.
          Before the human design review gate, perform an Impeccable Design Critique:

          1. Activate the `impeccable` skill using the `activate_skill(name: 'impeccable')` tool (do NOT use `read_file` on external paths outside the workspace) and review the UI architecture:
             - If Stitch was enabled: inspect screens in `specs/<feature>/designs/*.html` and `tokens.css`.
             - If Stitch was NOT enabled: inspect UI wireframes, component contracts, and design tokens specified in `plan.md`.
          2. Evaluate visual hierarchy, cognitive load (Operate vs Persuade), contrast ratios (WCAG AA), typographic rhythm, and Tailwind/shadcn tokens.
          3. Generate `specs/<feature>/designs/DESIGN_CRITIQUE.md` with:
             - Executive Assessment
             - Heuristic Findings
             - Actionable Adjustments (or Stitch edit_screens prompts)
          4. Output a concise 5-line summary for the human reviewer in the terminal.

  - id: review-design
    type: if
    condition: "{{ inputs.has_ui and not inputs.auto_continue }}"
    then:
      - id: review-design-gate
        type: gate
        message: "Review UI design proposal and Impeccable critique in specs/<feature>/designs/DESIGN_CRITIQUE.md."
        options: [approve, reject]
        on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    input:
      args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --phased {% if inputs.has_ui %}--with-impeccable-lifecycle{% endif %}"

  - id: implement
    type: if
    condition: "{{ inputs.auto_continue }}"
    then:
      - id: implement-auto
        command: speckit.implement
        integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
        model: "{{ inputs.implement_model | default(inputs.model) }}"
        input:
          args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --phased --verify-gates --auto-continue"
    else:
      - id: implement-paused
        command: speckit.implement
        integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
        model: "{{ inputs.implement_model | default(inputs.model) }}"
        input:
          args: "{{ inputs.spec }} {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} --phased --verify-gates --pause-after-phase"

  - id: bootstrap_deps
    type: shell
    continue_on_error: true
    run: |
      if [ -f package.json ]; then
        if [ ! -d node_modules ] || { [ "{{ inputs.has_ui }}" = "true" ] && [ ! -d node_modules/@playwright/test ]; }; then
          echo "Installing dependencies..." >/dev/tty 2>/dev/null || true
          npm install --no-audit --no-fund || vp install || pnpm install || true
        fi
      fi

  - id: bootstrap_env
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/bootstrap-project-env.sh --has-ui={{ inputs.has_ui }} || true

  - id: gate_quality
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-quality-gate.sh {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [QUALITY GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
        bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
        exit $err
      }

  - id: gate_bundle
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-bundle-budget.sh || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [PERFORMANCE GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
        bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
        exit $err
      }

  - id: gate_runtime
    type: if
    condition: "{{ not inputs.has_ui }}"
    then:
      - id: gate_runtime_check
        type: shell
        continue_on_error: true
        run: |
          bash .specify/scripts/bash/check-dev-entrypoint.sh --require-contract || {
            err=$?
            echo "" >/dev/tty 2>/dev/null || true
            echo "⚠️  [RUNTIME GATE] The declared runtime entrypoint does not serve (Exit $err)." >/dev/tty 2>/dev/null || true
            bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
            exit $err
          }

  - id: gate_contracts
    type: if
    condition: "{{ inputs.has_ui }}"
    then:
      - id: gate_contracts_check
        type: shell
        continue_on_error: true
        run: |
          bash .specify/scripts/bash/check-contracts.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} || {
            err=$?
            echo "" >/dev/tty 2>/dev/null || true
            echo "⚠️  [CONTRACT GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
            bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
            exit $err
          }
      - id: gate_visual_check
        type: shell
        continue_on_error: true
        run: |
          bash .specify/scripts/bash/verify-stitch-design.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %} || {
            err=$?
            echo "" >/dev/tty 2>/dev/null || true
            echo "⚠️  [VISUAL GATE DETECTED ISSUES - Exit $err]" >/dev/tty 2>/dev/null || true
            bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
            exit $err
          }

  # The tagged half of the ledger is derived, not asserted. Tasks carrying
  # [verify:<gate>] are ticked (or un-ticked) from the evidence those gates just
  # wrote, so the checkbox cannot claim a verification that regressed. It runs
  # BEFORE gate_tasks: the completion gate must judge a ledger that already
  # reflects reality, not one waiting for an agent to catch up.
  - id: reconcile_tasks
    type: shell
    continue_on_error: true
    run: |
      # Degrade, do not loop, when the script is missing (a workflow updated
      # without its scripts): a hard failure here would leave the tagged tasks
      # unchecked and hand gate_tasks a red ledger it cannot repair.
      if [ -f .specify/scripts/bash/reconcile-task-ledger.sh ]; then
        bash .specify/scripts/bash/reconcile-task-ledger.sh
      else
        echo "⚠️  [TASK LEDGER] reconcile-task-ledger.sh is not installed; [verify:*] tasks will not be derived."
        echo "   Reinstall the bundle to restore ledger reconciliation."
      fi

  - id: gate_tasks
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-tasks-complete.sh || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [TASKS GATE] Unchecked tasks remain (Exit $err)." >/dev/tty 2>/dev/null || true
        exit $err
      }

  # ---------------------------------------------------------------------------
  # Bounded self-healing loop. Every deterministic gate is repaired, re-run and
  # re-evaluated. The recheck steps MUST NOT append `|| true`: a swallowed exit
  # code would make the loop condition always false (the previous loop's bug).
  # ---------------------------------------------------------------------------
  - id: repair_gates
    type: if
    # NO PARENTHESES. The Spec Kit expression engine is a hand-rolled splitter
    # (specify_cli/workflows/expressions.py), not a Python/Jinja parser: it splits
    # on top-level ` or ` first, then on ` and `, then on comparisons, and it has
    # NO grouping support at all. A bracketed sub-expression never reaches a
    # comparison operator, so it resolves as an unknown identifier and is False,
    # silently. Wrapping the profile guards in `( )` made those clauses
    # permanently false, so a profile-only failure was invisible whenever it was
    # the ONLY failing gate: no repair window here, and no abort in
    # `fail_after_repair` — the run fell through to `verify`, which is an LLM
    # re-run of the gates, not a deterministic abort. "and" binds tighter than
    # "or" here, which is exactly what the unparenthesised chain below relies on.
    condition: >-
      {{ steps.gate_quality.output.exit_code != 0
      or steps.gate_bundle.output.exit_code != 0
      or not inputs.has_ui and steps.gate_runtime_check.output.exit_code != 0
      or inputs.has_ui and steps.gate_contracts_check.output.exit_code != 0
      or inputs.has_ui and steps.gate_visual_check.output.exit_code != 0
      or steps.gate_tasks.output.exit_code != 0 }}
    then:
      - id: repair_gates_loop
        type: do-while
        max_iterations: 3
        # Same parenthesis-free grammar as `repair_gates` (see the note there).
        # The progress guard is conjoined into EVERY gate clause instead of
        # wrapping the chain in `( … ) and guard`: without grouping, a trailing
        # `and` would bind to the last `or` branch only, and a leading bracket
        # would make the whole condition permanently false.
        condition: >-
          {{ steps.recheck_quality.output.exit_code != 0
          and steps.assess_repair_progress.output.exit_code == 0
          or steps.recheck_bundle.output.exit_code != 0
          and steps.assess_repair_progress.output.exit_code == 0
          or not inputs.has_ui and steps.recheck_runtime_check.output.exit_code != 0
          and steps.assess_repair_progress.output.exit_code == 0
          or inputs.has_ui and steps.recheck_contracts_check.output.exit_code != 0
          and steps.assess_repair_progress.output.exit_code == 0
          or inputs.has_ui and steps.recheck_visual_check.output.exit_code != 0
          and steps.assess_repair_progress.output.exit_code == 0
          or steps.recheck_tasks.output.exit_code != 0
          and steps.assess_repair_progress.output.exit_code == 0 }}
        steps:
          # The circuit breaker and this bounded loop both cap retries. Without a
          # reset, attempt 3 can be spent on "CIRCUIT BREAKER TRIPPED" instead of
          # the real failure, and a resumed run starts blocked until a human resets.
          - id: reset_breaker
            type: shell
            continue_on_error: true
            run: |
              # --source=workflow is what makes the reset auditable: an agent reset
              # and a human reset are the same command, and without this field all
              # three look identical in telemetry.
              bash .specify/scripts/bash/check-blast-radius.sh --reset --source=workflow
              bash .specify/scripts/bash/bootstrap-project-env.sh --has-ui={{ inputs.has_ui }} || true
              # Baseline for the progress guard, captured AFTER bootstrap settles
              # so the loop measures the agent's work, not the environment's.
              bash .specify/scripts/bash/repair-loop-guard.sh --snapshot --step=repair_agent || true
          - id: repair_agent
            type: prompt
            integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
            model: "{{ inputs.implement_model | default(inputs.model) }}"
            timeout: 1800
            prompt: |
              ROLE: RELIABILITY & COMPILER SRE SPECIALIST (AUTONOMOUS REPAIR).
              The implementation gates failed. You own this repair window: fix the
              APPLICATION CODE and the PRODUCT BEHAVIOR, never the checks.

              EVIDENCE FIRST:
              - First, discover the active feature directory under `specs/` (e.g. `specs/001-*`, or inspect `feature_dir` via `bash .specify/scripts/bash/emit-telemetry.sh --summary`). Do NOT look for a literal directory named `<feature>`.
              - Read `specs/<active-feature>/evidence/quality-gate.json`, `bundle-budget.json`,
                `tasks.json` (and `contracts.json` only if this is a UI feature). To view telemetry events and run logs, execute `bash .specify/scripts/bash/emit-telemetry.sh --summary` in the terminal.
              - Reproduce each failure by running the real gate in the terminal before
                changing anything.
              - STALE EVIDENCE: `*.json` is only the latest snapshot; check
                `*.history.jsonl`. If a later entry passed, the artifact is stale.
                Re-run the gate and trust the fresh result. Never change green code
                to satisfy a stale red artifact, and never edit evidence by hand.

              SANDBOX & POLICY MANDATES (CRITICAL):
              - NEVER call `list_directory`, `read_file`, or file tools on `.git/`, `node_modules/`, or git-ignored files like `.specify/telemetry.jsonl` or `.specify/workflows/runs/*` (violates sandbox / tool ignore boundaries). Inspect git state via `git status`, `git diff` and telemetry via `bash .specify/scripts/bash/emit-telemetry.sh --summary`.
              - NEVER use `replace` or `write_file` on `package.json` (blocked by CLI security policy for build configuration files).
                To add scripts or configure `package.json`, use terminal commands:
                * For scripts: `npm pkg set scripts.dev:api="tsx watch src/main.ts"` or `npm pkg set scripts.build="vite build"`.
                * For dependencies: `npm install <pkg>` or `npm install -D <pkg>` / `vp install`.

              REPAIR RULES (NON-NEGOTIABLE):
              - NEVER pass `--allow-no-tests`, `--allow-incomplete`, `--allow-missing`,
                `--allow-foreign-git`, `--tokens-only`, `--skip-tests`, `--skip-build`
                or `--skip-orphans`. This loop exists to fix code, not to silence gates.
              - NEVER edit `.specify/scripts/**`, `vite.config.*`, `vitest.config.*`,
                `package.json` quality scripts, test snapshots, lint/complexity rules,
                or any evidence JSON by hand.
              - ZERO EXECUTED TESTS is the most common failure: write real co-located
                unit/integration tests for the feature slice, then re-run the gate.
                A scaffold placeholder is not an implementation.
              - GHOST SELECTOR: add the declared `data-testid` / `id` / class to the
                component. The manifest is human-owned; if the design genuinely
                differs, stop and ask instead of rewriting it.
              - MISSING PLAYWRIGHT ASSETS: `bootstrap-project-env.sh` already
                materialized `playwright.design.config.ts` and
                `tests/design/design-audit.spec.ts` when designs exist. Verify them
                instead of deleting the visual gate.
              - MISSING DESIGN ARTIFACTS (UI features): when
                `specs/<active-feature>/designs/` lacks screen HTML, `tokens.css`,
                `routes-manifest.json` or its fixtures, GENERATE them. Local
                wireframe HTML is a valid fallback when Stitch is disabled. Then
                wire `tokens.css` into the app stylesheet so the DOM exposes the
                tokens. Never skip the contracts/visual gates and never pass
                `--tokens-only` to make them disappear.
              - UNCHECKED TASKS: implement the untagged ones. Mark an untagged task
                ONLY with `bash .specify/scripts/bash/mark-task-done.sh --id=T001`
                — never by editing `tasks.md`. It refuses unless
                `check-quality-gate.sh` passed AND that pass postdates your last
                edit, so re-run the gate (with `--scope` when the run declares one)
                before marking in bulk. A finished feature with an empty ledger
                still fails `gate_tasks`: before this window ends, mark every
                untagged task that is demonstrably done and print
                `task id -> justification` for each; leave the rest unchecked with a
                one-line reason.
              - NEVER TOUCH `[verify:<gate>]` TASKS. They are not yours to tick or
                un-tick: the workflow re-derives them from the gate evidence on every
                iteration. If one is unchecked, the gate it names is red — fix the
                gate, not the checkbox. Editing it by hand is tampering with a mirror
                of the gates.
              - RUNTIME ENTRYPOINT (non-UI features): when the declared runtime does not
                serve, fix the API or the declaration itself. Declaring the Vite dev
                server as the API runtime, editing `specs/<active-feature>/runtime.json` to a
                port nothing listens on, or removing the project's `dev` script is
                forbidden. The expected fix is a real API entrypoint script
                (`dev:api`) bound to the port exported by `src/config/env.ts` (configured via `npm pkg set scripts.dev:api="..."`).
              - DEPENDENCIES: install with `npm install` / `vp install` in the terminal.
                NEVER use file-reading tools on `node_modules/` (sandbox symlink errors).

              Re-run the failing gates yourself and print a 5-line summary:
              root cause -> fix -> gate result per failing gate.
          - id: recheck_quality
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-quality-gate.sh {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %}
          - id: recheck_bundle
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-bundle-budget.sh
          - id: recheck_runtime
            type: if
            condition: "{{ not inputs.has_ui }}"
            then:
              - id: recheck_runtime_check
                type: shell
                continue_on_error: true
                run: |
                  bash .specify/scripts/bash/check-dev-entrypoint.sh --require-contract
          - id: recheck_contracts
            type: if
            condition: "{{ inputs.has_ui }}"
            then:
              - id: recheck_contracts_check
                type: shell
                continue_on_error: true
                run: |
                  bash .specify/scripts/bash/check-contracts.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %}
              - id: recheck_visual_check
                type: shell
                continue_on_error: true
                run: |
                  bash .specify/scripts/bash/verify-stitch-design.sh --require-ui {% if inputs.scope %}--scope={{ inputs.scope }}{% endif %}
          # Re-derive the tagged tasks before judging them: a gate that went green
          # in this iteration must show up in the ledger, and one that regressed
          # must not.
          - id: reconcile_tasks_recheck
            type: shell
            continue_on_error: true
            run: |
              if [ -f .specify/scripts/bash/reconcile-task-ledger.sh ]; then
                bash .specify/scripts/bash/reconcile-task-ledger.sh
              else
                echo "⚠️  [TASK LEDGER] reconcile-task-ledger.sh is not installed; skipping derivation."
              fi
          - id: recheck_tasks
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-tasks-complete.sh
          # Progress guard and window measurement. A repair window that changed
          # nothing will reproduce the same failure, so the loop stops instead of
          # spending its remaining attempts (up to 30 minutes each) to learn what
          # this one already proved. It also emits the `repair_window` telemetry
          # event: no `repair_agent` step event is ever written, so without this
          # the window's real duration is invisible.
          # MUST run last so it observes every recheck, and MUST NOT swallow its
          # exit code: the do-while condition reads it.
          - id: assess_repair_progress
            type: shell
            continue_on_error: true
            run: |
              # Degrade to "keep retrying" when the guard is not installed (a
              # workflow updated without its scripts). Exiting non-zero here would
              # stop the loop and report a stall that never happened.
              if [ -f .specify/scripts/bash/repair-loop-guard.sh ]; then
                bash .specify/scripts/bash/repair-loop-guard.sh --assess --step=repair_agent
              else
                echo "ℹ️  [REPAIR LOOP GUARD] repair-loop-guard.sh is not installed; stall detection is off."
              fi
      - id: fail_after_repair
        type: if
        # Parenthesis-free for the same reason as `repair_gates` (see the note there).
        condition: >-
          {{ steps.recheck_quality.output.exit_code != 0
          or steps.recheck_bundle.output.exit_code != 0
          or not inputs.has_ui and steps.recheck_runtime_check.output.exit_code != 0
          or inputs.has_ui and steps.recheck_contracts_check.output.exit_code != 0
          or inputs.has_ui and steps.recheck_visual_check.output.exit_code != 0
          or steps.recheck_tasks.output.exit_code != 0 }}
        then:
          - id: abort_unrepaired
            type: shell
            run: |
              echo "" >/dev/tty 2>/dev/null || true
              if [ -s .specify/.repair-loop/reason.txt ]; then
                echo "❌ [REPAIR LOOP STALLED]: the last repair window produced no tree change and no commit." >/dev/tty 2>/dev/null || true
                echo "   The loop stopped early rather than repeating an identical failure. A commit counts" >/dev/tty 2>/dev/null || true
                echo "   as progress; rewriting only evidence files does not." >/dev/tty 2>/dev/null || true
                cat .specify/.repair-loop/reason.txt >/dev/tty 2>/dev/null || true
              else
                echo "❌ [REPAIR LOOP EXHAUSTED]: gates are still failing after 3 repair attempts." >/dev/tty 2>/dev/null || true
              fi
              echo "   The workflow stops instead of shipping a broken feature. Inspect the evidence below." >/dev/tty 2>/dev/null || true
              bash .specify/scripts/bash/emit-telemetry.sh --import-state --summary >/dev/tty 2>/dev/null || true
              echo "" >/dev/tty 2>/dev/null || true
              echo "   Next step: fix the root cause, reset the breaker:" >/dev/tty 2>/dev/null || true
              echo "     bash .specify/scripts/bash/check-blast-radius.sh --reset --source=human" >/dev/tty 2>/dev/null || true
              echo "   Keep --source=human: a workflow reset, a human reset and an agent reset" >/dev/tty 2>/dev/null || true
              echo "   are the same command, and telemetry cannot tell them apart without it." >/dev/tty 2>/dev/null || true
              echo "   then resume the run with 'specify workflow resume'." >/dev/tty 2>/dev/null || true
              exit 1

  - id: verify
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.model }}"
    timeout: 900
    prompt: |
      ROLE: LEAD ADVERSARIAL QUALITY AUDITOR (INDEPENDENT QC INSPECTOR).
      You did NOT write this implementation, and you MUST NOT trust any prior
      self-reported claim in `tasks.md` or the agent's summary.

      MANDATORY PROTOCOL: read `.specify/workflows/viteplus-stitch/AUDITOR.md`
      and execute it exactly. It defines the evidence rules, the re-execution
      commands, the acceptance-scenario matrix, the accessibility audit, and the
      machine-verdict contract.

      Two deliverables are required, both under `specs/<feature>/`:
      1. `evidence/verification.json` with `{"verdict": "pass" | "reject", ...}`.
      2. `VERIFICATION_REPORT.md` whose `VERDICT:` line matches that JSON.

      The workflow fails unless the machine verdict is `"pass"`. If the feature is
      a scaffold, reject it and list the blocking reasons. Never soften a reject.

  - id: gate_verdict
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/check-verification-verdict.sh || {
        err=$?
        echo "" >/dev/tty 2>/dev/null || true
        echo "⚠️  [VERDICT GATE] Independent audit did not approve the feature (Exit $err). Entering repair loop." >/dev/tty 2>/dev/null || true
        exit $err
      }

  - id: repair_verdict
    type: if
    condition: "{{ steps.gate_verdict.output.exit_code != 0 }}"
    then:
      - id: repair_verdict_loop
        type: do-while
        max_iterations: 2
        condition: "{{ steps.gate_verdict_retry.output.exit_code != 0 and steps.assess_verdict_progress.output.exit_code == 0 }}"
        steps:
          - id: reset_breaker_verdict
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-blast-radius.sh --reset --source=workflow
              # Same progress guard as the gates loop. A rejecting audit whose
              # repair window changed nothing will be rejected identically, so
              # the second (45-minute) window is not worth spending.
              bash .specify/scripts/bash/repair-loop-guard.sh --snapshot --step=verdict_repair_agent || true
          - id: verdict_repair_agent
            type: prompt
            integration: "{{ inputs.implement_integration | default(inputs.integration) }}"
            model: "{{ inputs.implement_model | default(inputs.model) }}"
            timeout: 1800
            prompt: |
              ROLE: RELIABILITY ENGINEER (POST-AUDIT REPAIR).
              The independent auditor REJECTED this feature.

              1. Discover the active feature directory under `specs/` (e.g. `specs/001-*`, or inspect `feature_dir` in `.specify/telemetry.jsonl`). Do NOT look for a literal directory named `<feature>`.
              2. Read `specs/<active-feature>/evidence/verification.json` — the `reasons`
                 array lists the blocking findings — and `VERIFICATION_REPORT.md`.
              3. Fix the APPLICATION CODE so every blocking reason is closed.
              4. SANDBOX & POLICY MANDATES:
                 - NEVER call `list_directory`, `read_file`, or file tools on `.git/` or `node_modules/` (violates sandbox boundaries). Inspect git state exclusively via terminal: `git status`, `git diff`.
                 - NEVER use `replace` or `write_file` on `package.json` (blocked by CLI security policy for build configuration files). Configure scripts/dependencies via terminal: `npm pkg set scripts.<name>="..."` or `npm install`.
              5. Re-run the deterministic gates yourself to confirm.

              You may NOT edit the audit report, the verdict JSON, other evidence
              artifacts, or any gate. You may NOT pass `--allow-*` flags. Passing
              those would silence the gate instead of fixing the product, and the
              independent auditor re-audits from scratch after you finish.
          - id: verify_retry
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ inputs.model }}"
            timeout: 900
            prompt: |
              ROLE: LEAD ADVERSARIAL QUALITY AUDITOR (RE-AUDIT AFTER REPAIR).
              The previous audit REJECTED this feature. Read the previous
              `verification.json` `reasons` and `VERIFICATION_REPORT.md`, then audit
              the CURRENT state FROM SCRATCH. Do not assume the repair worked.

              Follow `.specify/workflows/viteplus-stitch/AUDITOR.md` exactly, re-run
              the gates yourself, and OVERWRITE `evidence/verification.json` and
              `VERIFICATION_REPORT.md` with the fresh verdict. A prose report without
              the machine verdict is invalid.
          - id: gate_verdict_retry
            type: shell
            continue_on_error: true
            run: |
              bash .specify/scripts/bash/check-verification-verdict.sh
          # Progress guard, read by the loop condition. Never `|| true` here.
          - id: assess_verdict_progress
            type: shell
            continue_on_error: true
            run: |
              if [ -f .specify/scripts/bash/repair-loop-guard.sh ]; then
                bash .specify/scripts/bash/repair-loop-guard.sh --assess --step=verdict_repair_agent
              else
                echo "ℹ️  [REPAIR LOOP GUARD] repair-loop-guard.sh is not installed; stall detection is off."
              fi

  - id: telemetry_sync
    type: shell
    continue_on_error: true
    run: |
      bash .specify/scripts/bash/emit-telemetry.sh --import-state || true
      bash .specify/scripts/bash/emit-telemetry.sh --summary >/dev/tty 2>/dev/null || true

  # Final hard gate: the workflow must not report success without an approving
  # machine verdict. This step has no continue_on_error on purpose.
  - id: gate_verdict_final
    type: shell
    run: |
      bash .specify/scripts/bash/check-verification-verdict.sh
